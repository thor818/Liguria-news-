<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Riviera — Eventi in Liguria e Costa Azzurra</title>
<meta name="description" content="Sagre, feste, eventi e cose da fare tra Genova, Savona, Imperia e la Costa Azzurra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2ea;
    --paper: #fffdf9;
    --ink: #13202c;
    --muted: #64707c;
    --line: #e7dfd2;
    --navy: #0b2a40;
    --sea: #1263a0;
    --coral: #ef6a45;
    --lemon: #ffd23f;
    --radius: 22px;
    --shadow: 0 1px 2px rgba(19,32,44,.04), 0 10px 30px rgba(19,32,44,.07);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: clip; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  em { font-style: italic; color: var(--coral); }

  /* ---------- Barra in alto ---------- */
  .topbar { position: fixed; inset: 12px 0 auto; z-index: 20; pointer-events: none; }
  .bar {
    pointer-events: auto; max-width: 1160px; margin: 0 auto; height: 58px; padding: 0 8px 0 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: rgba(255, 253, 249, .8); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid rgba(231, 223, 210, .9); border-radius: 999px; box-shadow: var(--shadow);
  }
  @media (max-width: 1200px) { .bar { margin: 0 12px; } }
  .logo { font-family: "Instrument Serif", serif; font-size: 1.7rem; text-decoration: none; letter-spacing: -.01em; }
  .logo i { color: var(--coral); }
  .nav { display: flex; gap: 4px; }
  .nav a { text-decoration: none; font-size: .9rem; font-weight: 500; color: var(--muted); padding: 8px 14px; border-radius: 999px; }
  .nav a:hover { background: var(--bg); color: var(--ink); }
  .lang { position: relative; }
  .lang summary { list-style: none; cursor: pointer; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 999px; font: 600 .85rem Inter, sans-serif; user-select: none; }
  .lang summary::-webkit-details-marker { display: none; }
  .lang-list { position: absolute; right: 0; top: calc(100% + 10px); background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 40px rgba(19,32,44,.16); padding: 6px; min-width: 190px; display: grid; }
  .lang-list button { border: 0; background: none; text-align: left; padding: 10px 14px; border-radius: 12px; font: 500 .92rem Inter, sans-serif; cursor: pointer; color: var(--ink); }
  .lang-list button b { display: inline-block; width: 30px; color: var(--muted); font-size: .78rem; }
  .lang-list button:hover { background: var(--bg); }
  .lang-list button.on { background: var(--navy); color: #fff; }
  .lang-list button.on b { color: var(--lemon); }

  /* ---------- Copertina ---------- */
  .hero { padding: 120px 0 0; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--sea); background: #e3eef7; padding: 7px 14px; border-radius: 999px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .hero h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(3.2rem, 8.5vw, 7.2rem); line-height: .92; letter-spacing: -.025em; margin: 22px 0; }
  .hero p { font-size: 1.15rem; color: var(--muted); max-width: 40ch; margin: 0 0 30px; }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: .95rem; padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer; transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.dark { background: var(--navy); color: #fff; }
  .btn.light { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .btn .arr { transition: transform .2s; }
  .btn:hover .arr { transform: translateX(4px); }

  .scene { border-radius: 32px; overflow: hidden; aspect-ratio: 1 / 1.02; box-shadow: var(--shadow); position: relative; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .scene .sun { animation: rise 6s ease-in-out infinite alternate; }
  @keyframes rise { to { transform: translateY(-14px); } }
  .scene .boat { animation: sail 16s linear infinite; }
  @keyframes sail { from { transform: translateX(-80px); } to { transform: translateX(560px); } }
  .scene .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scene .stat { position: absolute; left: 18px; bottom: 18px; right: 18px; display: flex; gap: 10px; }
  .scene .stat div { flex: 1; background: rgba(255,255,255,.88); backdrop-filter: blur(8px); border-radius: 16px; padding: 12px 14px; }
  .scene .stat b { display: block; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 2rem; line-height: 1; }
  .scene .stat span { font-size: .75rem; color: var(--muted); font-weight: 500; }

  /* ---------- Ticker ---------- */
  .ticker { margin: 56px -10px 0; background: var(--navy); color: #fff; overflow: hidden; white-space: nowrap; padding: 16px 0; transform: rotate(-1deg); }
  .ticker .track { display: inline-flex; gap: 46px; animation: marquee 45s linear infinite; padding-left: 46px; }
  .ticker span { font-family: "Instrument Serif", serif; font-size: 1.5rem; }
  .ticker span small { font-family: Inter, sans-serif; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--lemon); margin-right: 10px; vertical-align: 3px; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  section { padding-top: 96px; }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
  .head h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1; letter-spacing: -.02em; margin: 0; }
  .head p { margin: 10px 0 0; color: var(--muted); max-width: 46ch; }
  .eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin-bottom: 10px; display: block; }

  /* ---------- Mappa ---------- */
  .map { background: var(--paper); border: 1px solid var(--line); border-radius: 28px; padding: 14px; box-shadow: var(--shadow); }
  .map svg { width: 100%; height: auto; display: block; }
  .pin { cursor: pointer; outline: none; }
  .pin .halo { fill: var(--coral); transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
  @keyframes halo { from { transform: scale(.6); opacity: .45; } to { transform: scale(1.8); opacity: 0; } }
  .pin .dot { fill: var(--coral); stroke: #fff; stroke-width: 3; transition: fill .2s; }
  .pin:hover .dot, .pin:focus .dot, .pin.on .dot { fill: var(--navy); }
  .pin .lbl { font: 600 19px Inter, sans-serif; fill: var(--ink); }
  .pin .n { font: 500 14px Inter, sans-serif; fill: var(--coral); }
  .town { font: 500 13px Inter, sans-serif; fill: #8a949d; }

  /* ---------- In primo piano (bento) ---------- */
  .bento { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; }
  .tile { position: relative; border-radius: var(--radius); overflow: hidden; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 26px; min-height: 230px; isolation: isolate; }
  .tile.big { grid-row: span 2; min-height: 480px; }
  .tile .bg { position: absolute; inset: 0; z-index: -2; transition: transform .6s; }
  .tile .bg img { width: 100%; height: 100%; object-fit: cover; }
  .tile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(8,20,30,.7), rgba(8,20,30,0) 62%); }
  .tile:hover .bg { transform: scale(1.05); }
  .tile .emo { position: absolute; top: 22px; right: 24px; font-size: 4.2rem; filter: drop-shadow(0 8px 16px rgba(0,0,0,.18)); transition: transform .4s; }
  .tile:hover .emo { transform: rotate(-8deg) scale(1.08); }
  .tile .bg:has(img) ~ .emo, .card .media:has(img) .emo { display: none; }
  .tile.big .emo { font-size: 8rem; top: 40px; right: 44px; }
  .tile .when { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
  .tile h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 2.1rem; line-height: 1.05; margin: 6px 0 4px; }
  .tile.big h3 { font-size: clamp(2.8rem, 5vw, 4.2rem); }
  .tile p { margin: 0; opacity: .92; max-width: 42ch; }

  /* ---------- Filtri ---------- */
  .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--paper); padding: 9px 16px; border-radius: 999px; font: 500 .9rem Inter, sans-serif; cursor: pointer; color: var(--ink); transition: all .15s; }
  .chip:hover { border-color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- Schede ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; }
  .card { background: var(--paper); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; text-decoration: none; transition: transform .25s, box-shadow .25s; animation: pop .4s ease both; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px); } }
  .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(19,32,44,.12); }
  .card .media { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; font-size: 4rem; overflow: hidden; }
  .card .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .media .emo { transition: transform .35s; filter: drop-shadow(0 6px 12px rgba(0,0,0,.15)); }
  .card:hover .media .emo { transform: scale(1.15) rotate(-6deg); }
  .badge { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); padding: 6px 11px; border-radius: 999px; font-size: .74rem; font-weight: 600; }
  .badge.soon { left: auto; right: 12px; background: var(--lemon); }
  .card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .date { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); }
  .card h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 1.7rem; line-height: 1.05; margin: 0; }
  .card p { margin: 0; font-size: .93rem; color: var(--muted); }
  .card .foot { margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); }
  .card .go { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--ink); transition: background .2s, color .2s; }
  .card:hover .go { background: var(--coral); color: #fff; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--muted); background: var(--paper); border-radius: var(--radius); border: 1px dashed var(--line); }

  .g-sagre { background: radial-gradient(circle at 30% 20%, #fff3c4, transparent 50%), linear-gradient(135deg, #ffd66b, #f39a3d); }
  .g-feste { background: radial-gradient(circle at 70% 20%, #ffd9cb, transparent 50%), linear-gradient(135deg, #ff9a76, #e5533a); }
  .g-musica { background: radial-gradient(circle at 30% 80%, #e7dcff, transparent 50%), linear-gradient(135deg, #a58bff, #5b3fc4); }
  .g-mercatini { background: radial-gradient(circle at 70% 70%, #ffe1e4, transparent 50%), linear-gradient(135deg, #f7a3ab, #c8404f); }
  .g-cultura { background: radial-gradient(circle at 30% 30%, #d5f0fb, transparent 50%), linear-gradient(135deg, #79c3e6, #1f6fa5); }
  .g-sport { background: radial-gradient(circle at 70% 30%, #d9f7e2, transparent 50%), linear-gradient(135deg, #6fd394, #23874a); }

  /* ---------- Cosa fare (carosello) ---------- */
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 23%); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 20px 20px; margin: 0 -20px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .exp { isolation: isolate; scroll-snap-align: start; position: relative; aspect-ratio: 3 / 4; border-radius: var(--radius); overflow: hidden; color: #fff; text-decoration: none; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .25s; }
  .exp:hover { transform: translateY(-6px); }
  .exp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .6s; }
  .exp:hover img { transform: scale(1.06); }
  .exp:has(img)::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(8,20,30,.8), rgba(8,20,30,0) 60%); }
  .exp:has(img) .emo { display: none; }
  .exp .emo { position: absolute; top: 20px; left: 20px; font-size: 3rem; }
  .exp .num { position: absolute; top: 18px; right: 22px; font-family: "Instrument Serif", serif; font-size: 1.4rem; opacity: .6; }
  .exp b { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 2rem; line-height: 1.05; }
  .exp .sub { font-size: .88rem; opacity: .88; margin-top: 6px; }
  .rail-nav { display: flex; gap: 8px; }
  .rail-nav button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 1.1rem; color: var(--ink); }
  .rail-nav button:hover { background: var(--ink); color: #fff; }

  /* ---------- Siti ---------- */
  .sites { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .site { position: relative; overflow: hidden; border-radius: 28px; padding: 40px; min-height: 300px; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; transition: transform .25s; }
  .site:hover { transform: translateY(-4px); }
  .site.it { background: linear-gradient(140deg, #0f7a5a, #0b2a40); }
  .site.fr { background: linear-gradient(140deg, #2353c8, #0b2a40 75%); }
  .site::before { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; right: -90px; top: -110px; background: rgba(255,255,255,.08); }
  .site .flag { font-size: 2.4rem; }
  .site h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 3.2rem; line-height: 1; margin: 6px 0 10px; }
  .site p { margin: 0; opacity: .85; max-width: 36ch; }
  .site .btn { align-self: flex-start; background: #fff; color: var(--ink); }

  /* ---------- Newsletter ---------- */
  .news { margin-top: 96px; position: relative; overflow: hidden; background: var(--lemon); border-radius: 32px; padding: 56px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: center; }
  .news::after { content: "✉"; position: absolute; right: -10px; bottom: -70px; font-size: 16rem; opacity: .08; transform: rotate(-12deg); pointer-events: none; }
  .news h2 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(2.2rem, 4.5vw, 3.4rem); line-height: 1; margin: 0 0 10px; }
  .news p { margin: 0; }
  .news form { position: relative; z-index: 1; display: flex; background: #fff; border-radius: 999px; padding: 6px; }
  .news input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0 18px; font: 1rem Inter, sans-serif; }

  footer { margin-top: 96px; background: var(--navy); color: #b8c7d3; padding: 56px 0 40px; font-size: .9rem; }
  footer .wrap { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; }
  footer .logo { color: #fff; font-size: 2.4rem; }
  .credits { margin-top: 14px; }
  .credits summary { cursor: pointer; color: #fff; }
  .credits ul { padding-left: 18px; font-size: .78rem; line-height: 1.6; }
  .credits a { color: #b8c7d3; }
  footer p { margin: 8px 0 0; max-width: 46ch; }

  /* ---------- Animazioni in entrata ---------- */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  @media (max-width: 900px) {
    .nav { display: none; }
    .hero { padding-top: 100px; }
    .hero-grid, .sites, .news, footer .wrap { grid-template-columns: 1fr; }
    .scene { aspect-ratio: 4 / 3.4; }
    .bento { grid-template-columns: 1fr; grid-template-rows: none; }
    .tile.big { grid-row: auto; min-height: 380px; }
    .tile .bg:has(img) ~ .emo, .card .media:has(img) .emo { display: none; }
  .tile.big .emo { font-size: 5.5rem; top: 26px; right: 28px; }
    .rail { grid-auto-columns: 72%; }
    .news { padding: 34px 24px; }
    .site { padding: 30px; min-height: 240px; }
    section { padding-top: 72px; }
    .scene .stat div { padding: 8px 10px; }
    .scene .stat b { font-size: 1.5rem; }
    .map { padding: 8px; overflow-x: auto; scrollbar-width: none; }
    .map svg { min-width: 760px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="bar">
    <a class="logo" href="#">La <i>Riviera</i></a>
    <nav class="nav">
      <a href="#mappa" data-i18n="navMap"></a>
      <a href="#eventi" data-i18n="navEvents"></a>
      <a href="#cosa-fare" data-i18n="navTodo"></a>
      <a href="#siti" data-i18n="navSites"></a>
    </nav>
    <details class="lang" id="langMenu">
      <summary aria-label="Language">🌐 <span id="langCur">IT</span> ▾</summary>
      <div class="lang-list" id="langList"></div>
    </details>
  </div>
</header>

<!-- ================= COPERTINA ================= -->
<div class="hero">
  <div class="wrap hero-grid">
    <div>
      <span class="pill" id="issue"></span>
      <h1 data-i18n-html="heroTitle"></h1>
      <p data-i18n="heroLead"></p>
      <div class="cta">
        <a class="btn dark" href="#eventi"><span data-i18n="ctaEvents"></span> <span class="arr">→</span></a>
        <a class="btn light" href="#mappa" data-i18n="ctaMap"></a>
      </div>
    </div>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 500 510" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb37a"/><stop offset=".55" stop-color="#ffd9a8"/><stop offset="1" stop-color="#fff0d6"/>
          </linearGradient>
          <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3fa7d6"/><stop offset="1" stop-color="#0b2a40"/>
          </linearGradient>
        </defs>
        <rect width="500" height="510" fill="url(#sky)"/>
        <circle class="sun" cx="330" cy="190" r="62" fill="#ffd23f"/>
        <path d="M0 230 Q 90 150 190 210 T 380 190 T 500 175 V 300 H 0Z" fill="#9db06a"/>
        <path d="M0 265 Q 120 205 230 250 T 500 235 V 310 H 0Z" fill="#7b8f3c"/>
        <g transform="translate(40 228)">
          <rect x="0" y="20" width="26" height="40" fill="#f3b07c"/><rect x="24" y="8" width="22" height="52" fill="#ef6a45"/>
          <rect x="44" y="26" width="28" height="34" fill="#ffd9a8"/><rect x="70" y="0" width="16" height="60" fill="#e5533a"/>
          <polygon points="70,0 78,-16 86,0" fill="#b9402c"/><rect x="84" y="18" width="30" height="42" fill="#f6c46b"/>
          <rect x="112" y="30" width="24" height="30" fill="#f3b07c"/>
          <g fill="#13202c" opacity=".35"><rect x="6" y="30" width="5" height="7"/><rect x="30" y="18" width="5" height="7"/><rect x="52" y="36" width="5" height="7"/><rect x="92" y="28" width="5" height="7"/><rect x="31" y="34" width="5" height="7"/><rect x="118" y="40" width="5" height="7"/></g>
        </g>
        <rect y="285" width="500" height="225" fill="url(#seaG)"/>
        <g stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M40 320 h40 M140 345 h60 M300 330 h50 M380 370 h70 M60 400 h50 M220 420 h40"/>
        </g>
        <path d="M290 292 Q 330 302 370 292" stroke="#ffd23f" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>
        <g class="boat"><g transform="translate(0 300)">
          <path d="M0 22 h46 l-8 10 h-30z" fill="#fffdf9"/><path d="M22 20 V -14 L44 18z" fill="#fffdf9"/><path d="M20 20 V -6 L4 18z" fill="#ef6a45"/>
        </g></g>
      </svg>
      <img class="photo" src="foto/hero.jpg" alt="" onerror="this.remove()">
      <div class="stat">
        <div><b id="statEvents">0</b><span data-i18n="statEvents"></span></div>
        <div><b>4</b><span data-i18n="statZones"></span></div>
        <div><b id="statLangs">6</b><span data-i18n="statLangs"></span></div>
      </div>

/* Punti sulla mappa: [x, y, spostamento etichetta x, y] */
const PINS = { genova: [922, 36, -40, 46], savona: [718, 74, 20, -4], imperia: [514, 232, -30, 50], azur: [168, 306, -56, 52] };

/* ======================= LOGICA ======================= */
const pickLang = (l) => (l = (l || "").slice(0, 2).toLowerCase()) in LANGS ? l : null;
let lang = pickLang(navigator.language) || "it";
try { lang = pickLang(localStorage.getItem("riviera-lang")) || lang; } catch (e) {}
lang = pickLang(new URLSearchParams(location.search).get("lang")) || lang;
let zone = "all", cat = "all";

const T = () => I18N[lang];
const tx = (item) => item.t[lang] || item.t.en;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const day = (iso) => new Date(iso + "T00:00:00");
const today = new Date(); today.setHours(0, 0, 0, 0);

/* Eventi non ancora finiti, in ordine di data */
const UPCOMING = EVENTS.filter((e) => day(e.end || e.date) >= today).sort((a, b) => a.date.localeCompare(b.date));

function fmtDate(e) {
  const f = (iso, opt) => day(iso).toLocaleDateString(T().locale, opt);
  if (!e.end) return f(e.date, { day: "numeric", month: "long" });
  return `${f(e.date, { day: "numeric", month: "short" })} – ${f(e.end, { day: "numeric", month: "short" })}`;
}

function countdown(e) {
  const n = Math.round((day(e.date) - today) / 864e5);
  if (n < 0) return T().now;
  if (n === 0) return T().today;
  if (n === 1) return T().tomorrow;
  return n <= 30 ? T().inDays(n) : "";
}

const media = (e) => e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";

function renderTicker() {
  const items = UPCOMING.map((e) => `<span><small>${esc(fmtDate(e))}</small>${esc(tx(e)[0])}</span>`).join("");
  $("#ticker").innerHTML = items + items;
  $("#statEvents").textContent = UPCOMING.length;
  $("#statLangs").textContent = Object.keys(LANGS).length;
}

function renderPins() {
  $("#mapItaly").textContent = T().map.italy;
  $("#mapFrance").textContent = T().map.france;
  $("#mapSea").textContent = T().map.sea;
  $("#pins").innerHTML = Object.entries(PINS).map(([k, [x, y, dx, dy]]) => {
    const n = UPCOMING.filter((e) => e.zone === k).length;
    return `<g class="pin ${zone === k ? "on" : ""}" data-k="${k}" tabindex="0" role="button">
      <circle class="halo" cx="${x}" cy="${y}" r="22"/><circle class="dot" cx="${x}" cy="${y}" r="11"/>
      <text class="lbl" x="${x + dx}" y="${y + dy}">${esc(T().zones[k])}</text>
      <text class="n" x="${x + dx}" y="${y + dy + 18}">${n} ${n === 1 ? T().events1 : T().eventsN} →</text>
    </g>`;
  }).join("");
  $("#pins").querySelectorAll(".pin").forEach((p) => {
    const go = () => { zone = p.dataset.k; renderPins(); renderEvents(); $("#eventi").scrollIntoView({ behavior: "smooth" }); };
    p.addEventListener("click", go);
    p.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
  });
}

function renderBento() {
  const feat = UPCOMING.filter((e) => e.featured).sort((a, b) => a.featured - b.featured).slice(0, 3);
  $("#bento").innerHTML = feat.map((e, i) => {
    const [title, place, text] = tx(e);
    return `<a class="tile ${i === 0 ? "big" : ""}" href="${esc(e.url)}" target="_blank" rel="noopener">
      <div class="bg g-${e.cat}">${media(e)}</div>
      <span class="emo">${e.icon}</span>
      <span class="when">${esc(fmtDate(e))} · ${esc(place)}</span>
      <h3>${esc(title)}</h3>
      <p>${esc(text)}</p>
    </a>`;
  }).join("");
}

function chips(el, items, current, onPick) {
  el.innerHTML = [["all", T().all], ...Object.entries(items)]
    .map(([k, v]) => `<button class="chip ${k === current ? "on" : ""}" data-k="${k}">${esc(v)}</button>`).join("");
  el.onclick = (ev) => { const b = ev.target.closest(".chip"); if (b) onPick(b.dataset.k); };
}

function renderEvents() {
  const zoneLabels = Object.fromEntries(Object.entries(T().zones).map(([k, v]) => [k, "📍 " + v]));
  chips($("#zoneChips"), zoneLabels, zone, (k) => { zone = k; renderPins(); renderEvents(); });
  chips($("#catChips"), T().cats, cat, (k) => { cat = k; renderEvents(); });
  const list = UPCOMING.filter((e) => (zone === "all" || e.zone === zone) && (cat === "all" || e.cat === cat));
  $("#grid").innerHTML = list.length ? list.map((e, i) => {
    const [title, place, text] = tx(e), soon = countdown(e);
    return `<a class="card" href="${esc(e.url)}" target="_blank" rel="noopener" style="animation-delay:${i * 40}ms">
      <div class="media g-${e.cat}"><span class="emo">${e.icon}</span>${media(e)}
        <span class="badge">📍 ${esc(T().zones[e.zone])}</span>
        ${soon ? `<span class="badge soon">${esc(soon)}</span>` : ""}
      </div>
      <div class="body">
        <span class="date">${esc(fmtDate(e))}</span>
        <h3>${esc(title)}</h3>
        <p>${esc(text)}</p>
        <div class="foot"><span>${esc(place)}</span><span class="go">→</span></div>
      </div>
    </a>`;
  }).join("") : `<div class="empty">${T().empty}</div>`;
}

function renderTodo() {
  $("#rail").innerHTML = TODO.map((t, i) => {
    const [title, sub] = tx(t);
    return `<a class="exp" href="${esc(t.url)}" style="background:${t.bg}">
      ${t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <span class="emo">${t.icon}</span><span class="num">0${i + 1}</span>
      <b>${esc(title)}</b><span class="sub">${esc(sub)}</span>
    </a>`;
  }).join("");
}

function renderLangMenu() {
  $("#langCur").textContent = lang.toUpperCase();
  $("#langList").innerHTML = Object.entries(LANGS)
    .map(([k, v]) => `<button data-lang="${k}" class="${k === lang ? "on" : ""}"><b>${k.toUpperCase()}</b> ${v}</button>`).join("");
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = T()[el.dataset.i18nHtml]; });
  renderLangMenu(); renderTicker(); renderPins(); renderBento(); renderEvents(); renderTodo();
}

$("#langList").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("riviera-lang", lang); } catch (e) {}
  $("#langMenu").open = false;
  render();
});
document.addEventListener("click", (ev) => { if (!ev.target.closest("#langMenu")) $("#langMenu").open = false; });

document.querySelectorAll(".rail-nav button").forEach((b) => b.addEventListener("click", () => {
  $("#rail").scrollBy({ left: b.dataset.dir * 320, behavior: "smooth" });
}));

$("#newsForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  ev.target.querySelector("button").textContent = T().thanks;
});

/* Animazione delle sezioni quando entrano nello schermo */
const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), { threshold: 0.08 });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

render();
</script>
